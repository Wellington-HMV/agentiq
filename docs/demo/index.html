<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGENTIQ — ferramenta de agentes</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="data:," />
</head>
<body>
  <header id="topbar">
    <div id="brand"><span class="bot">[▣▣]</span> AGENTIQ</div>
    <div id="runmeta"></div>
  </header>

  <main>
    <aside id="runs-panel">
      <button id="btn-new-demand">+ nova demanda</button>
      <form id="demand-form" hidden>
        <textarea id="demand-goal" rows="3" placeholder="O que precisa ser feito?"></textarea>
        <input id="demand-project" type="text" placeholder="repositório alvo (ex: C:\projetos\meu-app)" />
        <label id="demand-live-label">
          <input type="checkbox" id="demand-live" /> agentes reais (Claude)
        </label>
        <button type="submit" id="demand-submit">▶ iniciar demanda</button>
        <div id="demand-error"></div>
      </form>
      <h2>Runs</h2>
      <ul id="runs-list"><li class="hint">loading…</li></ul>
    </aside>

    <section id="stage">
      <div class="hint" id="stage-hint">Demo estática — escolha um run real ao lado e assista ▸</div>
      <canvas id="factory" hidden></canvas>

      <div id="live-pill" hidden>● LIVE</div>

      <div id="decision-card" class="card" hidden>
        <h3>◆ DECISION</h3>
        <p id="decision-prompt"></p>
        <ul id="decision-options"></ul>
        <div id="decision-hint"></div>
      </div>

      <div id="summary-card" class="card" hidden>
        <h3>✓ RUN SUMMARY</h3>
        <div id="summary-body"></div>
      </div>

      <div id="hud-bottom" hidden>
        <div id="caption"></div>
        <div id="ticker"></div>
      </div>
    </section>
  </main>

  <footer id="keys">demo gravada de runs reais — o produto completo roda local: <code>agentiq web</code></footer>

  <script src="./demo-data.js"></script>
<script>
  // Static demo: serve the embedded run data instead of the API.
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => {
    const path = String(url);
    const json = (body, status = 200) =>
      Promise.resolve(new Response(JSON.stringify(body), { status }));
    if (path.endsWith("/api/runs") && (!opts || !opts.method || opts.method === "GET"))
      return json(window.DEMO.runs);
    let m = path.match(/\/api\/runs\/([^/]+)\/events$/);
    if (m) {
      const run = window.DEMO.data[m[1]];
      return run ? json(run.events) : json({ detail: "no run" }, 404);
    }
    m = path.match(/\/api\/runs\/([^/]+)\/summary$/);
    if (m) {
      const run = window.DEMO.data[m[1]];
      return run && run.summary ? json(run.summary) : json({ detail: "none" }, 404);
    }
    if (path.includes("/api/")) return json({ detail: "demo" }, 404);
    return realFetch(url, opts);
  };
  // No live runs in a static demo: WebSocket connections just stay silent.
  window.WebSocket = class { close() {} };
</script>

  <script type="module" src="./app.js"></script>
</body>
</html>
